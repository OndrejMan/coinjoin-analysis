name: coinjoin-analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Tests
    runs-on: [self-hosted, x86]

    steps:
    - name: Show environment paths
      run: python -c "import os, pathlib; print('HOME:', pathlib.Path.home()); print('PWD:', pathlib.Path.cwd()); print('GITHUB_WORKSPACE:', os.environ.get('GITHUB_WORKSPACE', ''))"

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Show pip version
      run: python -m pip -V

    - name: Install dependencies
      run: python -m pip install -r requirements.txt

    - name: Install project in editable mode
      run: python -m pip install -e .

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz libsqlite3-0

    - name: Run tests
      run: |
        python -m pip install pytest
        pytest

    - name: Show directory structure with tree
      if: always()
      run: python -c "from pathlib import Path; root = Path.cwd().parent / 'temp_dumplings'; print(root); print('\n'.join(str(p) for p in sorted(root.rglob('*'))[:200]) if root.exists() else 'Directory not found')"
