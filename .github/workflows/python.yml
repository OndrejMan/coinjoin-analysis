name: coinjoin-analysis

on:
  push:
    branches: [main, upstream]
  pull_request:

jobs:
  build:
    runs-on: [self-hosted, x64]
    env:
      PYTHON_3_11_OVERRIDE: ${{ vars.PYTHON_3_11 }}

    steps:
    - name: Show environment paths
      run: |
        echo "HOME: $HOME"
        echo "PWD: $(pwd)"
        echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Resolve Python 3.11 interpreter
      run: |
        echo "PYTHON_3_11=${PYTHON_3_11_OVERRIDE:-$HOME/diplomka/.python/3.11.15/bin/python3.11}" >> "$GITHUB_ENV"

    - name: Set up test environment
      run: |
        "$PYTHON_3_11" -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/python -m pip install -r requirements-dev.txt
        .venv/bin/python -m pip install -e .

    - name: Run tests
      run: .venv/bin/python -m pytest
