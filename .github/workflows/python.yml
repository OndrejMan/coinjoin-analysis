name: coinjoin-analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Tests
    runs-on: [self-hosted, x64]
    env:
      # Interpreter path on the self-hosted runner. Set the PYTHON_3_11
      # repository variable to override the default location below.
      PYTHON_3_11_OVERRIDE: ${{ vars.PYTHON_3_11 }}

    steps:
    - name: Show environment paths
      run: |
        echo "HOME: $HOME"
        echo "PWD: $PWD"
        echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE:-}"

    - name: Resolve Python 3.11 interpreter
      run: |
        echo "PYTHON_3_11=${PYTHON_3_11_OVERRIDE:-$HOME/diplomka/.python/3.11.15/bin/python3.11}" >> "$GITHUB_ENV"

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Show Python 3.11 version
      run: |
        "$PYTHON_3_11" --version

    - name: Create virtual environment
      run: |
        "$PYTHON_3_11" -m venv .venv

    - name: Upgrade pip
      run: .venv/bin/python -m pip install --upgrade pip

    - name: Show pip version
      run: .venv/bin/python -m pip -V

    - name: Install dependencies
      run: .venv/bin/python -m pip install -r requirements.txt

    - name: Install project in editable mode
      run: .venv/bin/python -m pip install -e .

    - name: Run tests
      run: |
        .venv/bin/python -m pip install pytest
        .venv/bin/python -m pytest

    - name: Show directory structure with tree
      if: always()
      run: |
        root="$(dirname "$PWD")/temp_dumplings"
        echo "$root"
        if [ -d "$root" ]; then
          find "$root" | sort | head -n 200
        else
          echo "Directory not found"
        fi
