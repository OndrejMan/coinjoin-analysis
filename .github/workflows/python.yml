name: coinjoin-analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Tests
    runs-on: [self-hosted, x64]
    env:
      PYTHON_3_11: /home/administrator/diplomka/.python/3.11.15/bin/python3.11

    steps:
    - name: Show environment paths
      run: |
        echo "HOME: $HOME"
        echo "PWD: $PWD"
        echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE:-}"

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Show Python 3.11 version
      run: |
        "$PYTHON_3_11" --version

    - name: Create virtual environment
      run: |
        "$PYTHON_3_11" -m venv .venv

    - name: Upgrade pip
      run: .venv/bin/python -m pip install --upgrade pip

    - name: Show pip version
      run: .venv/bin/python -m pip -V

    - name: Install dependencies
      run: .venv/bin/python -m pip install -r requirements.txt

    - name: Install project in editable mode
      run: .venv/bin/python -m pip install -e .

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz libsqlite3-0

    - name: Run tests
      run: |
        .venv/bin/python -m pip install pytest
        .venv/bin/python -m pytest

    - name: Show directory structure with tree
      if: always()
      run: |
        root="$(dirname "$PWD")/temp_dumplings"
        echo "$root"
        if [ -d "$root" ]; then
          find "$root" | sort | head -n 200
        else
          echo "Directory not found"
        fi
