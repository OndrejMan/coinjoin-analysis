[project]
name = "coinjoin-analysis"
version = "0.1.0"
description = "Processing, analysis, and visualization of coinjoin transactions."
requires-python = ">=3.11,<3.14"
dependencies = [
    "bitcoinlib~=0.7.2",
    "colorama==0.4.6",
    "contourpy==1.3.0",
    "cycler==0.12.1",
    "fastecdsa==3.0.1",
    "fonttools==4.55.3",
    "graphviz==0.20.3",
    "Jinja2~=3.1.6",
    "jsonpickle==4.0.1",
    "kiwisolver==1.4.7",
    "matplotlib~=3.10.0",
    "numpy~=2.2.1",
    "orjson==3.10.12",
    "packaging==24.2",
    "pandas==2.2.3",
    "pillow==11.0.0",
    "plotly~=6.0.0",
    "pyparsing==3.2.0",
    "python-bitcoinlib==0.12.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.2",
    "requests==2.32.3",
    "scipy~=1.14.1",
    "seaborn==0.13.2",
    "six==1.17.0",
    "sympy~=1.13.3",
    "tqdm==4.67.1",
    "tzdata==2024.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
